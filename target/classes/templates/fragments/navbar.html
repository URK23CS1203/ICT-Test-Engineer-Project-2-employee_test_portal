<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="navbar" class="navbar">

    <div class="brand">
        EmployeeTestPortal
    </div>

    <div class="user-area">

        <span class="logged-user">
            Welcome,
            <strong th:text="${loggedInUsername}">
                user
            </strong>
        </span>

        <form th:action="@{/logout}" method="post">

            <button class="logout-btn" type="submit">
                Logout
            </button>

        </form>

    </div>

</div>

</body>

</html>
